name: Build macOS Preview

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, 'claude/**']

permissions:
  contents: read

concurrency:
  # Only runs that really build share the group, so a newer build replaces an
  # older one. A run that skips (CI failed, `[skip build]`, a pull request)
  # gets a group of its own and must not cancel a build that is still going.
  group: >-
    ${{ (github.event_name != 'workflow_run' ||
    (github.event.workflow_run.conclusion == 'success' &&
    github.event.workflow_run.event == 'push' &&
    github.event.workflow_run.head_repository.full_name == github.repository &&
    !contains(github.event.workflow_run.head_commit.message, '[skip build]'))) &&
    'build-macos-preview' || format('build-macos-idle-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  PHONON_REF: 49b9033e44ab0fbb935973eca3213757644d1bbb
  # Raise when the native build below changes in a way the cache key cannot
  # see, for example new compiler flags.
  PHONON_CACHE_REVISION: v1

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml
  build:
    needs: verify
    if: >-
      always() && !cancelled() &&
      (needs.verify.result == 'success' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository &&
        !contains(github.event.workflow_run.head_commit.message, '[skip build]')))
    runs-on: macos-latest
    env:
      FUNDUS_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.FUNDUS_COMMIT }}
          persist-credentials: false

      # The engine is pinned, so the same inputs always give the same library.
      - name: Reuse an earlier Phonon build
        id: phonon-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/phonon-macos
          key: phonon-macos-${{ runner.arch }}-${{ env.PHONON_REF }}-${{ hashFiles('tools/patch_phonon_voices.py') }}-${{ env.PHONON_CACHE_REVISION }}

      - name: Set up Rust
        if: steps.phonon-cache.outputs.cache-hit != 'true'
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          cache: false
          # Warnings in a pinned third-party engine are not ours to fix.
          build-warnings: warn

      - name: Check out pinned Phonon engine
        if: steps.phonon-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: gradium-ai/xn-ptts
          ref: ${{ env.PHONON_REF }}
          path: .build/phonon
          persist-credentials: false

      - name: Add external Phonon voice catalogue support
        if: steps.phonon-cache.outputs.cache-hit != 'true'
        run: python3 tools/patch_phonon_voices.py .build/phonon

      - name: Build Phonon for macOS
        if: steps.phonon-cache.outputs.cache-hit != 'true'
        working-directory: .build/phonon
        run: |
          cargo build --release -p ptts-ffi --locked
          out="$RUNNER_TEMP/phonon-macos"
          mkdir -p "$out"
          cp target/release/libptts_ffi.dylib LICENSE-APACHE LICENSE-MIT "$out/"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify release network entitlements
        run: |
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.server' app/macos/Runner/Release.entitlements | grep -qx true
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.client' app/macos/Runner/Release.entitlements | grep -qx true

      - name: Build macOS release
        working-directory: app
        run: flutter build macos --release --dart-define=FUNDUS_VERSION=0.2.0 --dart-define=FUNDUS_BUILD=${{ github.run_number }} --dart-define=FUNDUS_COMMIT="$FUNDUS_COMMIT"

      - name: Include Phonon and sign the app bundle
        run: |
          app="app/build/macos/Build/Products/Release/Fundus2.app"
          phonon="$RUNNER_TEMP/phonon-macos"
          cp "$phonon/libptts_ffi.dylib" "$app/Contents/MacOS/libptts_ffi.dylib"
          mkdir -p "$app/Contents/Resources"
          cp "$phonon/LICENSE-APACHE" "$app/Contents/Resources/PHONON-LICENSE-APACHE.txt"
          cp "$phonon/LICENSE-MIT" "$app/Contents/Resources/PHONON-LICENSE-MIT.txt"
          codesign --force --deep --sign - --entitlements app/macos/Runner/Release.entitlements "$app"

      - name: Verify application signature
        working-directory: app
        run: |
          xattr -cr build/macos/Build/Products/Release/Fundus2.app
          codesign --verify --deep --strict --verbose=2 build/macos/Build/Products/Release/Fundus2.app
          codesign -d --entitlements :- build/macos/Build/Products/Release/Fundus2.app > /tmp/fundus-release-entitlements.plist 2>/dev/null
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.server' /tmp/fundus-release-entitlements.plist | grep -qx true
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.client' /tmp/fundus-release-entitlements.plist | grep -qx true

      - name: Package application
        working-directory: app
        run: >-
          ditto -c -k --keepParent
          build/macos/Build/Products/Release/Fundus2.app
          Fundus-macOS.zip

      - name: Upload preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Fundus-macOS-${{ env.FUNDUS_COMMIT }}
          path: app/Fundus-macOS.zip
          if-no-files-found: error
          retention-days: 90

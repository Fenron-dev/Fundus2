name: Build Android Preview

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, 'claude/**']

permissions:
  contents: read

concurrency:
  group: build-android-preview
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml
  build:
    needs: verify
    if: >-
      always() && !cancelled() &&
      (needs.verify.result == 'success' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    env:
      FUNDUS_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.FUNDUS_COMMIT }}

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android NDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ndk;28.2.13676358

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable

      - name: Check out pinned Phonon engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: gradium-ai/xn-ptts
          ref: 49b9033e44ab0fbb935973eca3213757644d1bbb
          path: .build/phonon
          persist-credentials: false

      - name: Add external Phonon voice catalogue support
        run: python3 tools/patch_phonon_voices.py .build/phonon

      - name: Build Phonon for Android
        working-directory: .build/phonon
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS='-C strip=symbols -C link-arg=-Wl,-z,max-page-size=16384 -C target-cpu=generic -C target-feature=+dotprod,+fp16'
          export CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS='-C strip=symbols -C link-arg=-Wl,-z,max-page-size=16384 -C target-cpu=x86-64'
          unset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
          cargo ndk -t arm64-v8a -t x86_64 -o "$RUNNER_TEMP/phonon-jniLibs" build --release -p ptts-ffi --locked
          mkdir -p "$GITHUB_WORKSPACE/app/android/app/src/main/jniLibs"
          cp -R "$RUNNER_TEMP/phonon-jniLibs/." "$GITHUB_WORKSPACE/app/android/app/src/main/jniLibs/"
          mkdir -p "$GITHUB_WORKSPACE/app/android/app/src/main/assets"
          cp LICENSE-APACHE LICENSE-MIT "$GITHUB_WORKSPACE/app/android/app/src/main/assets/"

      # A debug key is generated on every hosted runner and cannot update an
      # APK from an earlier run. Failing here is safer than publishing an APK
      # that forces users to uninstall and lose app-private data.
      - name: Restore stable preview signing key
        id: signing
        env:
          FUNDUS_ANDROID_KEYSTORE_BASE64: ${{ secrets.FUNDUS_ANDROID_KEYSTORE_BASE64 }}
          FUNDUS_ANDROID_STORE_PASSWORD: ${{ secrets.FUNDUS_ANDROID_STORE_PASSWORD }}
          FUNDUS_ANDROID_KEY_ALIAS: ${{ secrets.FUNDUS_ANDROID_KEY_ALIAS }}
          FUNDUS_ANDROID_KEY_PASSWORD: ${{ secrets.FUNDUS_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$FUNDUS_ANDROID_KEYSTORE_BASE64" ] || \
             [ -z "$FUNDUS_ANDROID_STORE_PASSWORD" ] || \
             [ -z "$FUNDUS_ANDROID_KEY_ALIAS" ] || \
             [ -z "$FUNDUS_ANDROID_KEY_PASSWORD" ]; then
            echo "Stable Android-Signatur fehlt. Bitte die vier FUNDUS_ANDROID_* Secrets hinterlegen." >&2
            exit 1
          fi
          echo "$FUNDUS_ANDROID_KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/fundus-preview.p12"
          test -s "$RUNNER_TEMP/fundus-preview.p12"
          echo "store-file=$RUNNER_TEMP/fundus-preview.p12" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Android APK
        working-directory: app
        env:
          FUNDUS_ANDROID_STORE_FILE: ${{ steps.signing.outputs.store-file }}
          FUNDUS_ANDROID_STORE_PASSWORD: ${{ secrets.FUNDUS_ANDROID_STORE_PASSWORD }}
          FUNDUS_ANDROID_KEY_ALIAS: ${{ secrets.FUNDUS_ANDROID_KEY_ALIAS }}
          FUNDUS_ANDROID_KEY_PASSWORD: ${{ secrets.FUNDUS_ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=FUNDUS_VERSION=0.2.0 --dart-define=FUNDUS_BUILD=${{ github.run_number }} --dart-define=FUNDUS_COMMIT="$FUNDUS_COMMIT"

      - name: Upload preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Fundus-Android-${{ env.FUNDUS_COMMIT }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90

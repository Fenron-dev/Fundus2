name: Build Android Preview

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'app/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

concurrency:
  group: build-android-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Without the signing secret the build still produces an installable
      # APK — Gradle falls back to the debug key. Only updates in place need
      # the stable key, so a fresh repository can build before it has one.
      - name: Restore stable preview signing key
        id: signing
        env:
          FUNDUS_ANDROID_KEYSTORE_BASE64: ${{ secrets.FUNDUS_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$FUNDUS_ANDROID_KEYSTORE_BASE64" ]; then
            echo "$FUNDUS_ANDROID_KEYSTORE_BASE64" | base64 --decode \
              > "$RUNNER_TEMP/fundus-preview.p12"
            echo "store-file=$RUNNER_TEMP/fundus-preview.p12" >> "$GITHUB_OUTPUT"
          else
            echo "Kein Signaturschlüssel hinterlegt — Debug-Signatur." >&2
            echo "store-file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Android APK
        working-directory: app
        env:
          FUNDUS_ANDROID_STORE_FILE: ${{ steps.signing.outputs.store-file }}
          FUNDUS_ANDROID_STORE_PASSWORD: ${{ secrets.FUNDUS_ANDROID_STORE_PASSWORD }}
          FUNDUS_ANDROID_KEY_ALIAS: ${{ secrets.FUNDUS_ANDROID_KEY_ALIAS }}
          FUNDUS_ANDROID_KEY_PASSWORD: ${{ secrets.FUNDUS_ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Upload preview
        uses: actions/upload-artifact@v7
        with:
          name: Fundus-Android-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

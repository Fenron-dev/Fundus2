name: Build Android Preview

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'app/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

concurrency:
  group: build-android-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # A debug key is generated on every hosted runner and cannot update an
      # APK from an earlier run. Failing here is safer than publishing an APK
      # that forces users to uninstall and lose app-private data.
      - name: Restore stable preview signing key
        id: signing
        env:
          FUNDUS_ANDROID_KEYSTORE_BASE64: ${{ secrets.FUNDUS_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$FUNDUS_ANDROID_KEYSTORE_BASE64" ] || \
             [ -z "${{ secrets.FUNDUS_ANDROID_STORE_PASSWORD }}" ] || \
             [ -z "${{ secrets.FUNDUS_ANDROID_KEY_ALIAS }}" ] || \
             [ -z "${{ secrets.FUNDUS_ANDROID_KEY_PASSWORD }}" ]; then
            echo "Stable Android-Signatur fehlt. Bitte die vier FUNDUS_ANDROID_* Secrets hinterlegen." >&2
            exit 1
          fi
          echo "$FUNDUS_ANDROID_KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/fundus-preview.p12"
          test -s "$RUNNER_TEMP/fundus-preview.p12"
          echo "store-file=$RUNNER_TEMP/fundus-preview.p12" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Android APK
        working-directory: app
        env:
          FUNDUS_ANDROID_STORE_FILE: ${{ steps.signing.outputs.store-file }}
          FUNDUS_ANDROID_STORE_PASSWORD: ${{ secrets.FUNDUS_ANDROID_STORE_PASSWORD }}
          FUNDUS_ANDROID_KEY_ALIAS: ${{ secrets.FUNDUS_ANDROID_KEY_ALIAS }}
          FUNDUS_ANDROID_KEY_PASSWORD: ${{ secrets.FUNDUS_ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Upload preview
        uses: actions/upload-artifact@v7
        with:
          name: Fundus-Android-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

name: Build Windows Preview

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, 'claude/**']

permissions:
  contents: read

concurrency:
  # Only runs that really build share the group, so a newer build replaces an
  # older one. A run that skips (CI failed, `[skip build]`, a pull request)
  # gets a group of its own and must not cancel a build that is still going.
  group: >-
    ${{ (github.event_name != 'workflow_run' ||
    (github.event.workflow_run.conclusion == 'success' &&
    github.event.workflow_run.event == 'push' &&
    github.event.workflow_run.head_repository.full_name == github.repository &&
    !contains(github.event.workflow_run.head_commit.message, '[skip build]'))) &&
    'build-windows-preview' || format('build-windows-idle-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  PHONON_REF: 49b9033e44ab0fbb935973eca3213757644d1bbb
  # Raise when the native build below changes in a way the cache key cannot
  # see, for example new compiler flags.
  PHONON_CACHE_REVISION: v1

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml
  build:
    needs: verify
    if: >-
      always() && !cancelled() &&
      (needs.verify.result == 'success' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository &&
        !contains(github.event.workflow_run.head_commit.message, '[skip build]')))
    runs-on: windows-latest
    env:
      FUNDUS_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.FUNDUS_COMMIT }}
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # Runs before any third-party Rust code, so the secret is never present
      # in a job after foreign build scripts had their turn.
      - name: Test native Windows HTTPS and live metadata downloads
        working-directory: app
        env:
          FUNDUS_LIVE_HTTPS: '1'
          # Optional: absent credentials skip only the authenticated MAL test.
          FUNDUS_MAL_CLIENT_ID: ${{ secrets.FUNDUS_MAL_CLIENT_ID }}
        run: flutter test test/windows_metadata_http_test.dart --reporter expanded

      # The engine is pinned, so the same inputs always give the same library.
      - name: Reuse an earlier Phonon build
        id: phonon-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/phonon-windows
          key: phonon-windows-${{ env.PHONON_REF }}-${{ hashFiles('tools/patch_phonon_voices.py') }}-${{ env.PHONON_CACHE_REVISION }}

      - name: Set up Rust
        if: steps.phonon-cache.outputs.cache-hit != 'true'
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          cache: false
          # Warnings in a pinned third-party engine are not ours to fix.
          build-warnings: warn

      - name: Check out pinned Phonon engine
        if: steps.phonon-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: gradium-ai/xn-ptts
          ref: ${{ env.PHONON_REF }}
          path: .build/phonon
          persist-credentials: false

      - name: Add external Phonon voice catalogue support
        if: steps.phonon-cache.outputs.cache-hit != 'true'
        run: python tools/patch_phonon_voices.py .build/phonon

      - name: Build Phonon for Windows
        if: steps.phonon-cache.outputs.cache-hit != 'true'
        working-directory: .build/phonon
        shell: pwsh
        run: |
          cargo build --release -p ptts-ffi --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out = Join-Path $env:RUNNER_TEMP "phonon-windows"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target/release/ptts_ffi.dll $out
          Copy-Item LICENSE-APACHE, LICENSE-MIT $out

      - name: Build Windows release
        working-directory: app
        run: flutter build windows --release --dart-define=FUNDUS_VERSION=0.2.0 --dart-define=FUNDUS_BUILD=${{ github.run_number }} --dart-define=FUNDUS_COMMIT=$env:FUNDUS_COMMIT

      - name: Include Phonon and the Visual C++ runtime
        working-directory: app
        shell: pwsh
        run: |
          $release = (Resolve-Path "build/windows/x64/runner/Release").Path
          $phonon = Join-Path $env:RUNNER_TEMP "phonon-windows"
          Copy-Item (Join-Path $phonon "ptts_ffi.dll") $release
          New-Item -ItemType Directory -Force (Join-Path $release "THIRD-PARTY-LICENSES") | Out-Null
          Copy-Item (Join-Path $phonon "LICENSE-APACHE") (Join-Path $release "THIRD-PARTY-LICENSES/PHONON-LICENSE-APACHE.txt")
          Copy-Item (Join-Path $phonon "LICENSE-MIT") (Join-Path $release "THIRD-PARTY-LICENSES/PHONON-LICENSE-MIT.txt")
          $runtime = @(
            "vcruntime140.dll",
            "vcruntime140_1.dll",
            "msvcp140.dll",
            "msvcp140_1.dll"
          )
          foreach ($name in $runtime) {
            $source = Join-Path $env:WINDIR "System32\$name"
            if (-not (Test-Path $source)) {
              throw "Visual-C++-Runtime fehlt auf dem Runner: $source"
            }
            Copy-Item $source (Join-Path $release $name) -Force
          }

      - name: Package application
        working-directory: app
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath Fundus-Windows.zip `
            -CompressionLevel Optimal

      - name: Upload preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Fundus-Windows-${{ env.FUNDUS_COMMIT }}
          path: app/Fundus-Windows.zip
          if-no-files-found: error
          retention-days: 90

name: Build Windows Preview

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'app/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

concurrency:
  group: build-windows-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Test native Windows HTTPS and live metadata downloads
        working-directory: app
        env:
          FUNDUS_LIVE_HTTPS: '1'
        run: flutter test test/windows_metadata_http_test.dart --reporter expanded

      - name: Build Windows release
        working-directory: app
        run: flutter build windows --release

      - name: Include Visual C++ runtime
        working-directory: app
        shell: pwsh
        run: |
          $release = (Resolve-Path "build/windows/x64/runner/Release").Path
          $runtime = @(
            "vcruntime140.dll",
            "vcruntime140_1.dll",
            "msvcp140.dll",
            "msvcp140_1.dll"
          )
          foreach ($name in $runtime) {
            $source = Join-Path $env:WINDIR "System32\$name"
            if (-not (Test-Path $source)) {
              throw "Visual-C++-Runtime fehlt auf dem Runner: $source"
            }
            Copy-Item $source (Join-Path $release $name) -Force
          }

      - name: Package application
        working-directory: app
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath Fundus-Windows.zip `
            -CompressionLevel Optimal

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: Fundus-Windows-${{ github.sha }}
          path: app/Fundus-Windows.zip
          if-no-files-found: error
          retention-days: 14

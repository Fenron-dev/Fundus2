name: Build Windows Preview

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, 'claude/**']

permissions:
  contents: read

concurrency:
  group: build-windows-preview
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml
  build:
    needs: verify
    if: >-
      always() && !cancelled() &&
      (needs.verify.result == 'success' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: windows-latest
    env:
      FUNDUS_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.FUNDUS_COMMIT }}

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable

      - name: Check out pinned Phonon engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: gradium-ai/xn-ptts
          ref: 49b9033e44ab0fbb935973eca3213757644d1bbb
          path: .build/phonon
          persist-credentials: false

      - name: Add external Phonon voice catalogue support
        run: python tools/patch_phonon_voices.py .build/phonon

      - name: Build Phonon for Windows
        working-directory: .build/phonon
        run: cargo build --release -p ptts-ffi --locked

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Test native Windows HTTPS and live metadata downloads
        working-directory: app
        env:
          FUNDUS_LIVE_HTTPS: '1'
          # Optional: absent credentials skip only the authenticated MAL test.
          FUNDUS_MAL_CLIENT_ID: ${{ secrets.FUNDUS_MAL_CLIENT_ID }}
        run: flutter test test/windows_metadata_http_test.dart --reporter expanded

      - name: Build Windows release
        working-directory: app
        run: flutter build windows --release --dart-define=FUNDUS_VERSION=0.2.0 --dart-define=FUNDUS_BUILD=${{ github.run_number }} --dart-define=FUNDUS_COMMIT=$env:FUNDUS_COMMIT

      - name: Include Visual C++ runtime
        working-directory: app
        shell: pwsh
        run: |
          $release = (Resolve-Path "build/windows/x64/runner/Release").Path
          Copy-Item "$env:GITHUB_WORKSPACE/.build/phonon/target/release/ptts_ffi.dll" $release
          New-Item -ItemType Directory -Force (Join-Path $release "THIRD-PARTY-LICENSES") | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE/.build/phonon/LICENSE-APACHE" (Join-Path $release "THIRD-PARTY-LICENSES/PHONON-LICENSE-APACHE.txt")
          Copy-Item "$env:GITHUB_WORKSPACE/.build/phonon/LICENSE-MIT" (Join-Path $release "THIRD-PARTY-LICENSES/PHONON-LICENSE-MIT.txt")
          $runtime = @(
            "vcruntime140.dll",
            "vcruntime140_1.dll",
            "msvcp140.dll",
            "msvcp140_1.dll"
          )
          foreach ($name in $runtime) {
            $source = Join-Path $env:WINDIR "System32\$name"
            if (-not (Test-Path $source)) {
              throw "Visual-C++-Runtime fehlt auf dem Runner: $source"
            }
            Copy-Item $source (Join-Path $release $name) -Force
          }

      - name: Package application
        working-directory: app
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath Fundus-Windows.zip `
            -CompressionLevel Optimal

      - name: Upload preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Fundus-Windows-${{ env.FUNDUS_COMMIT }}
          path: app/Fundus-Windows.zip
          if-no-files-found: error
          retention-days: 90

name: fundus
description: Local-first media library and playback client.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.1

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  fundus_client: any
  fundus_core: any
  fundus_design: any
  fundus_server: any
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  archive: ^4.0.7
  basic_utils: ^5.8.2
  crypto: ^3.0.7
  http: ^1.5.0
  ffi: ^2.1.4
  shelf: ^1.4.2
  path: ^1.9.1
  path_provider: ^2.1.6
  file_picker: ^11.0.2
  pdfrx: ^2.4.7
  image: ^4.9.2
  audio_service: ^0.18.19
  qr_flutter: ^4.1.0
  xml: ^6.6.1
  mobile_scanner: ^7.4.0
  url_launcher: ^6.3.1
  flutter_secure_storage: ^10.3.1
  local_auth: ^3.0.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
